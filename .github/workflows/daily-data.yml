name: Daily market data

on:
  schedule:
    - cron: "30 11 * * 1-5" # 17:00 IST, after Indian market close and AMFI NAV updates begin
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend
      - run: python backend/fetch_data.py data/market.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "data: market update $(date -u +%F)"
          git push
